<!doctype html><html lang="nl"><head><meta charset=utf8><title>Themawoorden groep 8</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: één scherm zonder scrollen. Bovenaan een smalle band (titel, meanderende rivier als voortgang, weekkeuze); daaronder één speelvlak dat de rest van het scherm vult. Alles schaalt mee met het scherm, van iPad tot digibord. */
:root{
  /* Eén lichte weergave met zachte kleuren, ook als het apparaat op donker staat: in de klas ziet iedereen hetzelfde. */
  --bg:#F2F8F7; --surface:#FFFFFF; --ink:#17404A; --ink-soft:#456469; --line:#CFE0DF;
  --river:#14879B; --river-pale:#D3EDF0; --bank:#D6EBDA; --on-river:#FFFFFF;
  --buoy:#F4B942; --on-buoy:#3A2A00; --rival:#F2907B; --on-rival:#4A1208; --good:#1F7A4A; --good-bg:#DFF3E6; --bad:#B4443A; --bad-bg:#FAE5E1;
  /* Themakleur: een zachte tint waarop de route, de titelband en de themapagina staan. */
  --band:#C9EAEE; --on-band:#17404A; --band-soft:#3F6A72; --band-line:rgba(23,64,74,.26);
  --rt-bank:#A9D9B7; --rt-todo:#F4FCFD; --rt-done:#1E98AD; --rt-goal:#6CC4D2; --tk-ink:#17404A;
  /* Eén vaste kleur per oefenvorm: een lichte tint met een pictogram in de volle kleur. */
  --m-flash:#D9590B; --m-flash-bg:#FFE6D3; --m-match:#1F78C8; --m-match-bg:#DCECFB; --m-fill:#6A4BD6; --m-fill-bg:#E8E1FB; --m-quiz:#C22F66; --m-quiz-bg:#FBDFE9; --m-type:#0B8A7A; --m-type-bg:#D6F2EC; --m-test:#4E5968; --m-test-bg:#E6E9EE;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --fs-0:.95rem; --fs-1:1.0625rem; --fs-2:1.3rem; --fs-3:1.65rem; --fs-4:clamp(2rem,7vw,2.9rem);
  color-scheme:light;
}

/* Elk thema heeft eigen kleuren. Rivieren gebruikt de basiskleuren hierboven. */
[data-blk="culturen"]{--bg:#F7F4EC;--ink:#2A3150;--ink-soft:#555C77;--line:#DDD8CB;--river:#4A68C8;--river-pale:#DEE6F9;--bank:#E6DFCD;
  --band:#F1E1B4;--on-band:#2A3150;--band-soft:#5B5F78;--band-line:rgba(42,49,80,.26);--rt-bank:#DDC88E;--rt-todo:#FCF6E3;--rt-done:#4A68C8;--rt-goal:#4A68C8;--tk-ink:#2A3150}

*{box-sizing:border-box}
/* De hele pagina schaalt mee met het kader waarin hij staat: een browser, een digibord of een ingesloten kader (bijvoorbeeld in Canva).
   De lettergrootte volgt de krapste maat van het kader, zodat alles altijd op één scherm past en in het midden staat.
   Alleen op een staande telefoon scrolt de pagina gewoon. */
html{font-size:16px}
@media (min-width:521px), (min-aspect-ratio:3/4){ html{font-size:clamp(6px,min(2.15vw,1.78vh),34px);font-size:clamp(6px,min(2.15vw,1.78dvh),34px)} }
@media (min-aspect-ratio:5/4){ html{font-size:clamp(6px,min(1.5vw,2.3vh),34px);font-size:clamp(6px,min(1.5vw,2.3dvh),34px)} }
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs-1);line-height:1.5;min-height:100vh;min-height:100dvh}
body[data-deep]{background:var(--band);color:var(--on-band)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.wrap{max-width:76rem;margin-inline:auto;padding-inline:clamp(16px,2.2vw,2.5rem);padding-block:1rem 2rem;display:flex;flex-direction:column;gap:1rem}

.top{display:flex;flex-direction:column;gap:.3rem;background:var(--band);color:var(--on-band);border-radius:1.2rem;padding:.55rem .9rem .4rem}
.top .seg{background:transparent;border-color:var(--band-line)}
.top .seg-btn{color:var(--on-band)}
.top .seg{background:var(--rt-todo)}
.top .seg-btn[aria-pressed="true"]{background:var(--river);color:var(--on-river)}
.top .timer,.top .r-labels{color:var(--band-soft)}
.top .timer b{color:var(--on-band)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.25rem}
.top-info{display:flex;flex-wrap:nowrap;align-items:baseline;justify-content:space-between;gap:.2rem 1.5rem;flex:1 1 100%;min-width:0}
.timer{flex:none;margin:0;font-size:var(--fs-0);color:var(--ink-soft);white-space:nowrap}
.timer b{font-family:var(--display);font-size:var(--fs-2);color:var(--ink);font-variant-numeric:tabular-nums;margin-left:.25rem}
.prog{min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.1rem);line-height:1;margin:0;letter-spacing:-.01em}
.sub{margin:.25rem 0 0;color:var(--ink-soft);font-size:var(--fs-0)}
.seg{display:inline-flex;gap:2px;padding:3px;border:2px solid var(--line);border-radius:999px;background:var(--surface)}
.seg-btn{border:0;background:transparent;border-radius:999px;padding:.45rem .95rem;font-weight:700;font-size:var(--fs-0);min-height:2.5rem}
.seg-btn[aria-pressed="true"]{background:var(--river);color:var(--on-river)}

.river-svg{display:block;width:100%;height:auto}
/* De route staat altijd op de volle themakleur. */
.r-bank{stroke:var(--rt-bank)} .r-water{stroke:var(--rt-todo)} .r-done{stroke:var(--rt-done)}
.r-sea,.r-end{fill:var(--rt-goal)} .r-spring{fill:var(--rt-done)}
.tk{stroke:var(--tk-ink);stroke-width:1.6;stroke-linejoin:round} .tk-a{fill:var(--buoy)} .tk-b{fill:var(--rival)}
.tk-line{fill:none;stroke:var(--tk-ink);stroke-width:1.8;stroke-linecap:round}
.sail-a{fill:var(--buoy);stroke:var(--surface);stroke-width:1.5}
.sail-b{fill:var(--rival);stroke:var(--surface);stroke-width:1.5}
.hs-body{fill:var(--tk-ink)} .hs-leg{fill:none;stroke:var(--tk-ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round} .hs-tail{fill:none;stroke:var(--tk-ink);stroke-width:3.4;stroke-linecap:round}
.r-joint{stroke:var(--tk-ink);stroke-opacity:.16}
.tok-in{transform-box:fill-box;transform-origin:50% 100%}
.hop .tok-in{animation:hop .6s ease}
@keyframes hop{30%{transform:translateY(-10px) scale(1.2)}62%{transform:translateY(0) scale(.95)}100%{transform:none}}
.boat-hull{fill:var(--tk-ink);stroke:var(--surface);stroke-width:1.5}
.boat-mast{stroke:var(--tk-ink);stroke-width:2.5;fill:none}
#boat{transition:transform .7s ease}
.r-labels{display:flex;justify-content:space-between;gap:.5rem;color:var(--ink-soft);font-size:.85rem;letter-spacing:.03em}
.r-status{margin:0;font-size:var(--fs-1);line-height:1.3;min-width:0;padding:.15rem .2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-status b{font-family:var(--display);font-size:var(--fs-2)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:1.4rem;padding:clamp(1rem,4vw,1.75rem);display:flex;flex-direction:column;gap:1rem}
.panel p{margin:0}
.home{display:flex;flex-direction:column;gap:.6rem}
.foot-ask{display:flex;align-items:center;gap:.75rem 1rem;width:100%}
.foot-ask span{flex:1 1 auto;min-width:0}
.foot-ask .btn{flex:none}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
.mode{color:var(--ink);display:flex;flex-direction:column;gap:.3rem;text-align:left;padding:.75rem 1rem .85rem;border-radius:1.1rem;border:2px solid var(--line);background:var(--surface);transition:transform .15s ease,border-color .15s ease}
.mode:hover{transform:translateY(-2px);border-color:var(--river)}
.mode-top{display:flex;align-items:center;gap:.65rem}
.mode-ttl{display:flex;flex-direction:column;min-width:0}
.mode-ttl .eyebrow{line-height:1.25}
.badge{flex:none;display:grid;place-items:center;width:2.3rem;height:2.3rem;border-radius:.7rem;background:var(--m-bg,var(--river-pale));color:var(--m,var(--river))}
.badge-s{width:1.75rem;height:1.75rem;border-radius:.5rem}
.badge-duo{background:var(--buoy);color:var(--on-buoy)}
.ico{width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
[data-m="flash"]{--m:var(--m-flash);--m-bg:var(--m-flash-bg)} [data-m="match"]{--m:var(--m-match);--m-bg:var(--m-match-bg)} [data-m="fill"]{--m:var(--m-fill);--m-bg:var(--m-fill-bg)} [data-m="quiz"]{--m:var(--m-quiz);--m-bg:var(--m-quiz-bg)} [data-m="type"]{--m:var(--m-type);--m-bg:var(--m-type-bg)} [data-m="test"]{--m:var(--m-test);--m-bg:var(--m-test-bg)} [data-m="klas"]{--m:var(--on-buoy);--m-bg:var(--buoy)}
.mode[data-m]:hover{border-color:var(--m)}
.mode.dicht,.duo.dicht{opacity:.5;cursor:not-allowed;transform:none!important;filter:grayscale(.6)}
.mode.dicht .badge,.duo.dicht .badge{background:var(--line);color:var(--ink-soft)}
.mode.nu{border-color:var(--m,var(--river));box-shadow:0 0 0 3px var(--m-bg,var(--river-pale))}
.duo.nu{border-color:var(--buoy);box-shadow:0 0 0 3px var(--buoy)}
.vink{color:var(--good);text-transform:none;letter-spacing:0;white-space:nowrap}
.nu-lab{display:inline-block;padding:0 .4rem;border-radius:.35rem;background:var(--buoy);color:var(--on-buoy);text-transform:none;letter-spacing:0}
.foot-ask2{display:inline-flex;gap:.5rem;align-items:center;font-size:var(--fs-0)}
.eyebrow{font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;opacity:.85}
.mode-name{font-family:var(--display);font-weight:800;font-size:var(--fs-3);line-height:1.1}
.mode-desc{font-size:var(--fs-0);line-height:1.45}
.duo{display:flex;flex-direction:column;gap:.3rem;text-align:left;width:100%;padding:.75rem 1rem .85rem;border-radius:1.1rem;border:2px solid var(--river-pale);background:var(--river-pale);color:var(--ink);transition:transform .15s ease}
.duo:hover{transform:translateY(-2px)}
.duos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
/* Herkenningspunten langs de route. */
.d-far{fill:var(--rt-bank)} .d-green{fill:var(--rt-bank);stroke:var(--tk-ink);stroke-width:1;stroke-opacity:.45}
.d-line{fill:none;stroke:var(--tk-ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.6}
.d-dark{fill:var(--tk-ink);fill-opacity:.8} .d-light{fill:var(--surface);stroke:var(--tk-ink);stroke-width:1.2}
/* Typen, Toets en Klassenquiz. */
.type-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.5rem .75rem}
.type-lab{flex-basis:100%;font-weight:700;font-size:var(--fs-0)}
.type-in{flex:1 1 14rem;min-width:0;font:inherit;font-size:var(--fs-3);font-weight:700;padding:.4rem .9rem;border:2px solid var(--line);border-radius:.9rem;background:var(--surface);color:var(--ink);min-height:3.4rem}
.type-in:focus{outline:3px solid var(--buoy);outline-offset:2px;border-color:var(--river)}
.type-good{border-color:var(--good);background:var(--good-bg)} .type-bad{border-color:var(--bad);background:var(--bad-bg)}
.type-row .btn{flex:0 0 auto}
.opt-sel{border-color:var(--river);background:var(--river-pale)}
.klas{display:flex;flex-direction:column;justify-content:center;gap:1rem;min-height:0}
.klas-q{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4.2vw,3.6rem);line-height:1.25;margin:0;text-wrap:balance}
.klas-a{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,4.8rem);line-height:1.3;margin:0;color:var(--river)}
.klas-hide{visibility:hidden}
.foot{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:center;justify-content:space-between}
.foot .btn{min-height:2.5rem;padding-block:.35rem}
.link{background:none;border:0;padding:.4rem 0;color:var(--river);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:2.5rem}
.note{color:var(--ink-soft);font-size:.9rem;margin:0}
.start .note{color:var(--band-soft)}

.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.25rem 1rem;min-height:2.5rem}
.bar-left{display:flex;align-items:center;gap:1rem}
.bar-mode{display:inline-flex;align-items:center;gap:.45rem;font-weight:700}
.bar-mid{flex:1 1 14rem;text-align:center;font-size:var(--fs-0)}
.count{color:var(--ink-soft);font-size:var(--fs-0);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:.75rem}
.row .btn{flex:1 1 9rem}
.btn{font-weight:700;padding:.7rem 1.2rem;border-radius:.9rem;border:2px solid transparent;min-height:3.1rem}
.btn-primary{background:var(--river);color:var(--on-river)}
.btn-good{background:var(--good);color:var(--on-river)}
.btn-quiet{background:transparent;border-color:var(--line)}
.btn-quiet:hover{border-color:var(--river)}
.check{display:flex;gap:.5rem;align-items:center;color:var(--ink-soft);font-size:var(--fs-0)}
.check input{width:1.1rem;height:1.1rem;accent-color:var(--river)}

.card{width:100%;min-height:15rem;border-radius:1.4rem;border:3px solid var(--river);padding:1.5rem 1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;text-align:center;animation:turn .28s ease}
.card-front{background:var(--river);color:var(--on-river)}
.card-back{background:var(--bg);color:var(--ink)}
.card-lab{font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}
.card-main{font-family:var(--display);font-weight:800;font-size:var(--fs-4);line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.card-long{font-size:var(--fs-3);font-weight:600;line-height:1.25}
.card-hint{font-size:var(--fs-0);opacity:.85}
@keyframes turn{from{transform:rotateX(70deg);opacity:.3}to{transform:none;opacity:1}}

.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,5fr);gap:.6rem .75rem;align-items:start}
.col{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.col-h{font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);margin:0}
.tile{text-align:left;padding:.5rem .8rem;border:2px solid var(--line);border-radius:.75rem;background:var(--surface);min-height:3.4rem;font-size:.95rem;line-height:1.3;overflow-wrap:break-word;hyphens:auto}
.tile-w{font-weight:700}
.tile-sel{border-color:var(--river);background:var(--river-pale)}
.tile-done{border-color:var(--good);background:var(--good-bg);cursor:default}
.tile-done::after{content:" ✓";color:var(--good);font-weight:700}
.tile-bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.q-lead{margin:0;color:var(--ink-soft)}
.q-main{font-family:var(--display);font-weight:800;font-size:var(--fs-4);line-height:1.1;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.q-long{font-size:var(--fs-3);font-weight:600;line-height:1.25}
.q-zin{font-size:var(--fs-2);font-weight:600;line-height:1.45;text-wrap:pretty;overflow-wrap:break-word}
.gap{display:inline-block;min-width:5.5em;border-bottom:3px solid var(--river);line-height:1.1}
.gap-filled{color:var(--river);font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.75rem;align-items:center;text-align:left;padding:.6rem .9rem;border:2px solid var(--line);border-radius:.9rem;background:var(--surface);min-height:3.4rem;line-height:1.3}
.opt:hover:not(:disabled){border-color:var(--river)}
.opt-key{width:1.7rem;height:1.7rem;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.opt-mark{font-weight:700;font-size:var(--fs-0)}
.opt:disabled{cursor:default;color:var(--ink-soft)}
.opt-good,.opt-good:disabled{border-color:var(--good);background:var(--good-bg);color:var(--ink)}
.opt-good .opt-mark{color:var(--good)}
.opt-bad,.opt-bad:disabled{border-color:var(--bad);background:var(--bad-bg);color:var(--ink)}
.opt-bad .opt-mark{color:var(--bad)}
.fb{display:flex;flex-direction:column;gap:.75rem;min-height:1.5rem}
.fb p{margin:0}

.end-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem 1.2rem}
.end-h{font-family:var(--display);font-weight:800;font-size:var(--fs-3);line-height:1.15;margin:0;text-wrap:balance}
.score{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,9vw,3.4rem);line-height:1;color:var(--river);font-variant-numeric:tabular-nums}
.lab-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;min-height:2.5rem}
.pg{display:flex;align-items:center;gap:.5rem}
.pg-btn{width:2.5rem;height:2.5rem;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.3rem;font-weight:700;line-height:1;padding:0}
.pg-btn:disabled{opacity:.35;cursor:default}
.wl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wl li{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr) auto;gap:.15rem 1rem;padding:.5rem 0;border-top:1px solid var(--line);align-items:baseline;line-height:1.35}
.wl-w{font-weight:700}
.wl-z{grid-column:1 / -1;color:var(--ink-soft);font-size:var(--fs-0)}
.wl-z .gap-filled{color:var(--ink);font-weight:700;text-decoration:none}
.wl-tags{display:flex;gap:.4rem;align-items:baseline}
.wl-wk{color:var(--ink-soft);font-size:.85rem;white-space:nowrap}
.pill{font-size:.8rem;font-weight:700;padding:.05rem .5rem;border-radius:.35rem;text-transform:uppercase;letter-spacing:.05em;transform:rotate(-3deg);background:var(--good-bg);color:var(--good);border:1px solid var(--good);white-space:nowrap}
.pill-half{background:transparent;color:var(--ink-soft);border-color:var(--line)}
.start{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.55rem}
.start>p{margin:0}
.start-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;min-height:2.5rem}
.fs-btn{display:inline-flex;align-items:center;gap:.5rem;min-height:2.5rem;padding:.3rem .9rem;background:var(--surface);border-color:var(--line);color:var(--ink);font-size:var(--fs-0)}
.fs-btn .ico,.fs-ic .ico{width:1.2rem;height:1.2rem}
.fs-ic{flex:none;align-self:center;display:grid;place-items:center;width:2.5rem;height:2.5rem;padding:0;border-radius:50%;border:2px solid var(--band-line);background:var(--rt-todo);color:var(--on-band)}
.start-h{font-size:clamp(2.6rem,9vw,4.6rem)}
.start-lead{font-size:var(--fs-2);line-height:1.35;max-width:38rem;margin:0}
.start-river{display:block;width:100%;height:auto}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:.75rem;width:100%}
.themes-few{grid-template-columns:minmax(0,1fr)}
.theme{background:var(--band);color:var(--on-band);border-color:var(--band);padding:1.1rem 1.3rem 1.3rem}
.theme .mode-desc,.theme .week-n{color:var(--band-soft)}
.theme .meter{background:var(--rt-todo)} .theme .meter span{background:var(--rt-done)}
.theme:hover{border-color:var(--rt-done)}
body[data-deep] .start .eyebrow{color:var(--band-soft);opacity:1}
body[data-deep] .start .link{color:var(--on-band)}
.theme-svg{display:block;width:100%;height:auto;margin-bottom:.4rem}
.weeks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;width:100%}
.meter{display:block;width:100%;height:.5rem;border-radius:999px;background:var(--river-pale);overflow:hidden;margin-top:.5rem}
.meter span{display:block;height:100%;background:var(--river);border-radius:999px}
.week-n{font-size:var(--fs-0);color:var(--ink-soft)}

/* ---------- Koppelen ---------- */
function matchStart(){
  var ws=pick(6,true);S={ws:ws,sel:null,done:0,wrong:new Set(),mistakes:0,t0:0,timer:0,busy:false};
  function col(side,arr){return '<div class="col"><p class="col-h">'+(side==="L"?"Woorden":"Betekenissen")+'</p>'+arr.map(function(x){
    return '<button class="tile'+(side==="L"?" tile-w":"")+'" data-a="tile" data-v="'+side+x.id+'" id="t'+side+x.id+'">'+esc(side==="L"?x.w:x.m)+'</button>';}).join("")+'</div>';}
  stage.innerHTML=bar("0 seconden","Tik op een woord en daarna op de betekenis die erbij hoort.")+'<div class="cols">'+col("L",shuffle(ws))+col("R",shuffle(ws))+'</div>';
}
function tile(v){
  if(!S||S.busy)return;
  var side=v.charAt(0), id=Number(v.slice(1)), t=el("t"+v);
  if(!S.t0){S.t0=Date.now();S.timer=setInterval(function(){var c=el("count");if(c&&S)c.textContent=Math.round((Date.now()-S.t0)/1000)+" seconden";},1000);}
  if(!S.sel||S.sel.side===side){
    if(S.sel)S.sel.el.classList.remove("tile-sel");
    if(S.sel&&S.sel.el===t){S.sel=null;return;}
    S.sel={side:side,id:id,el:t};t.classList.add("tile-sel");return;
  }
  var a=S.sel;S.sel=null;a.el.classList.remove("tile-sel");
  if(a.id===id){
    [a.el,t].forEach(function(e){e.classList.add("tile-done");e.disabled=true;});
    if(!S.wrong.has(id)&&mark(id,true))(a.side==="L"?a.el:t).classList.add("tile-star");
    if(++S.done===S.ws.length)matchEnd();
  }else{
    S.mistakes++;
    [id,a.id].forEach(function(x){if(!S.wrong.has(x)){S.wrong.add(x);mark(x,false);}});
    S.busy=true;[a.el,t].forEach(function(e){e.classList.add("tile-bad");});
    setTimeout(function(){[a.el,t].forEach(function(e){e.classList.remove("tile-bad");});if(S)S.busy=false;},500);
  }
}
function matchEnd(){
  clearInterval(S.timer);
  var sec=Math.max(1,Math.round((Date.now()-S.t0)/1000)), m=S.mistakes, n=S.ws.length;S=null;markDone("match");
  setTimeout(function(){
    if(view!=="match")return;
    stage.innerHTML='<h2 class="end-h">Alles gekoppeld!</h2><p>'+n+' paren in '+sec+' seconden, '+(m===0?"zonder fouten.":m===1?"met 1 foutje.":"met "+m+" foutjes.")+'</p>'
     +'<div class="row"><button class="btn btn-primary" data-a="go" data-v="match">Nog een ronde</button><button class="btn btn-quiet" data-a="go" data-v="fill">Door naar Invullen</button><button class="btn btn-quiet" data-a="go" data-v="home">Terug</button></div>';
    maybeFin();
  },600);
}

   +'<div class="fb" id="fb" aria-live="polite"></div>';

function answer(k){
  if(!S||S.answered||!S.qs[S.i].opts[k])return;

/* ---------- Typen: het woord zelf schrijven ---------- */
function norm(t){return t.toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g," ").trim();}
function bare(t){return t.replace(/^(de|het) /,"");}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++)m[i]=[i];for(j=1;j<=b.length;j++)m[0][j]=j;
  for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];}
function typeStart(){var q=pick(10);S={kind:"type",qs:q,i:0,score:0,missed:[],tries:0,answered:false};renderType();}
function renderType(){
  var w=S.qs[S.i];S.answered=false;S.tries=0;
  stage.innerHTML=bar("Woord "+(S.i+1)+" van "+S.qs.length)
   +'<div><p class="q-lead">Welk woord hoort bij deze betekenis?</p><h2 class="q-main q-long" id="qmain">'+esc(w.m)+'</h2></div>'
   +'<form class="type-row" id="type-form" autocomplete="off"><label class="type-lab" for="type-in">Typ het woord</label>'
   +'<input class="type-in" id="type-in" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done">'
   +'<button class="btn btn-primary" type="submit" id="type-ok">Controleer</button></form>'
   +'<div class="fb" id="fb" aria-live="polite"></div>';
  el("type-in").focus({preventScroll:true});
}
function typeCheck(){
  if(!S||S.kind!=="type")return;
  if(S.answered)return next();
  var w=S.qs[S.i], inp=el("type-in"), v=norm(inp.value), goal=norm(w.w);
  if(!v)return;
  var ok=v===goal||v===bare(goal);
  /* Bijna goed (hooguit twee letters verschil)? Dan mag je het één keer opnieuw proberen. */
  if(!ok&&S.tries===0&&Math.min(lev(v,goal),lev(v,bare(goal)))<=2){
    S.tries=1;el("fb").innerHTML='<p>Bijna goed. Kijk nog eens naar de spelling en probeer het opnieuw.</p>';inp.focus({preventScroll:true});return;}
  S.answered=true;inp.readOnly=true;inp.classList.add(ok?"type-good":"type-bad");
  var learned=false;
  if(ok&&S.tries===0)learned=mark(w.id,true);else if(!ok)mark(w.id,false);
  if(ok)S.score++;else S.missed.push(w);
  el("fb").innerHTML='<p>'+(ok?(S.tries?"Goed, in je tweede poging.":"Goed zo!"+(learned?' <span class="stamp">Geleerd</span>':'')):"Niet goed. Het woord is <b>"+esc(w.w)+"</b>.")+'</p>';
  var b=el("type-ok");b.textContent=S.i===S.qs.length-1?"Bekijk je score":"Volgende woord";b.focus({preventScroll:true});
}

   +'<h2 class="end-h">'+B.race+'</h2>'
   +'<p>Speel met z’n tweeën of in twee teams op één iPad of op het digibord. Jullie krijgen steeds dezelfde vraag. Wie het eerst het goede antwoord aantikt, gaat een stuk verder. Tik je fout, dan doe je die vraag niet meer mee. '+B.raceRegel+'</p>'
   +'<div class="setup-row"><div><p class="setup-q">Hoe zitten jullie?</p>'+pressed("rseat",raceSeat,[["opp","Tegenover elkaar"],["side","Naast elkaar"]])+'</div>'
   +'<div><p class="setup-q">Hoe lang is de race?</p>'+pressed("rlen",raceLen,[[6,"Kort (6)"],[10,"Gewoon (10)"],[15,"Lang (15)"]])+'</div></div>'
   +'<p class="setup-set">Jullie spelen met de woorden van '+(setId==="all"?"week 1 en week 2":setId==="w1"?"week 1":"week 2")+'. Bovenaan de pagina kies je andere woorden.</p>'
   +'<div class="row"><button class="btn btn-primary" data-a="rstart">Start de race</button></div>';
}
function racePanel(p){
  return '<section class="rp '+(p?"rp-b":"rp-a")+'" id="rp'+p+'" aria-label="'+B.teams[p]+'"><header class="rp-h"><span class="rp-name">'+B.teams[p]+'</span><span class="rp-lead" id="rl'+p+'"></span><span class="rp-score" id="rs'+p+'"></span></header>'
   +'<h2 class="rp-q" id="rq'+p+'"></h2><div class="rp-opts" id="ro'+p+'"></div><p class="rp-msg" id="rm'+p+'" aria-live="polite"></p></section>';
}
function raceStart(){
  raceClose();
  G={n:raceLen,sc:[0,0],queue:shuffle(pool()),count:0,hard:[],q:null,locked:[false,false],open:false,done:true,timer:0,stopAt:0,endAt:0};
  raceEl=document.createElement("div");raceEl.className="race";raceEl.id="race";raceEl.lang="nl";raceEl.setAttribute("data-seat",raceSeat);
  raceEl.innerHTML=racePanel(1)
   +'<div class="rmid">'+routeSvg(B,"race",{cls:"race-svg",main:"rriv",title:"De race: wie is het eerst aan het eind?",tokens:[{id:"rb0",cls:"rboat",team:0},{id:"rb1",cls:"rboat",team:1}]})
   +'<button class="rstop" data-g="stop">Stop</button></div>'
   +racePanel(0);
  document.body.appendChild(raceEl);document.documentElement.style.overflow="hidden";
  raceEl.addEventListener("pointerdown",raceTouch);
  raceEl.addEventListener("click",function(e){if(e.detail===0)raceTouch(e);});
  raceBoats();raceNext();
}
function raceClose(){
  if(G)clearTimeout(G.timer);G=null;
  if(raceEl){raceEl.remove();raceEl=null;curPager=null;}
  document.documentElement.style.overflow="";
}
function raceBoats(){
  var path=el("rriv"),len=0;try{len=path.getTotalLength();}catch(e){}
  [0,1].forEach(function(p){
    el("rs"+p).textContent=G.sc[p]+" / "+G.n;
    if(len)var gg=geo("race",B.kind),gap=gg.gap||13;moveTok(el("rb"+p),path,len,Math.min(1,G.sc[p]/G.n),gg,p?9:-5,p?-gap:gap);
  });
}
function raceNext(){
  if(!G)return;
  var w=G.queue.shift();if(!G.queue.length)G.queue=shuffle(pool().filter(function(x){return x!==w;}));
  var dir=["wm","mw","zin"][G.count++%3], opts=shuffle([w].concat(distract(w,dir==="zin")));
  G.q={w:w,dir:dir,opts:opts,zi:pickZin(w)};G.locked=[false,false];G.open=false;G.done=false;
  raceEl.classList.remove("race-open");
  [0,1].forEach(function(p){
    el("rl"+p).textContent=dir==="wm"?"Wat betekent":dir==="mw"?"Welk woord past bij deze betekenis?":"Welk woord past in de zin?";
    var q=el("rq"+p);q.className="rp-q"+(dir==="wm"?"":" rp-q-long");q.innerHTML=dir==="wm"?esc(w.w):dir==="mw"?esc(w.m):zin(w,true,G.q.zi);
    el("ro"+p).innerHTML=shuffle([0,1,2,3]).map(function(k){return '<button class="ro" data-p="'+p+'" data-o="'+k+'">'+esc(dir==="wm"?opts[k].m:opts[k].w)+'</button>';}).join("");
    el("rm"+p).textContent="";el("rp"+p).classList.remove("rp-out");
  });
  /* Even wachten voor de knoppen werken: zo telt een vinger die nog aan het tikken was niet mee. */
  G.timer=setTimeout(function(){if(G){G.open=true;raceEl.classList.add("race-open");}},700);
}
function raceTouch(e){
  var t=e.target.closest("[data-g],[data-o]");if(!t||!G)return;
  var g=t.dataset.g;
  if(g==="pg"){if(curPager&&!t.disabled)curPager.go(Number(t.dataset.v));return;}
  if(g==="stop"){
    if(Date.now()-G.stopAt<3000)return raceQuit();
    G.stopAt=Date.now();t.textContent="Echt stoppen?";
    setTimeout(function(){if(t.isConnected)t.textContent="Stop";},3000);return;
  }
  if(g){if(Date.now()-G.endAt<900)return;if(g==="again")raceStart();else raceQuit();return;}
  e.preventDefault();raceTap(Number(t.dataset.p),Number(t.dataset.o));
}
function raceQuit(){raceClose();go("race");}
function raceTap(p,k){
  if(!G||!G.open||G.done||G.locked[p])return;
  var q=G.q;
  if(q.opts[k]===q.w){G.done=true;G.sc[p]++;return raceResolve(p);}
  G.locked[p]=true;
  raceEl.querySelector('.ro[data-p="'+p+'"][data-o="'+k+'"]').classList.add("ro-bad");
  el("rp"+p).classList.add("rp-out");el("rm"+p).textContent="Fout. Deze vraag doe je niet meer mee.";
  if(G.hard.indexOf(q.w)<0)G.hard.push(q.w);
  if(G.locked[1-p]){G.done=true;raceResolve(-1);}
}
function raceResolve(win){
  var q=G.q, ci=q.opts.indexOf(q.w);
  [0,1].forEach(function(p){
    raceEl.querySelectorAll('.ro[data-p="'+p+'"]').forEach(function(b){b.disabled=true;if(Number(b.dataset.o)===ci)b.classList.add("ro-good");});
    if(q.dir==="zin")el("rq"+p).innerHTML=zin(q.w,false,q.zi);
    el("rm"+p).textContent=win<0?"Niemand had het goed. Het goede antwoord heeft een vinkje."
      :win===p?"Goed! "+B.verder
      :G.locked[p]?B.teams[win]+" had het goed.":B.teams[win]+" was sneller.";
  });
  raceBoats();if(win>=0)hop(el("rb"+win));
  var over=G.sc[0]>=G.n||G.sc[1]>=G.n;
  G.timer=setTimeout(over?raceEnd:raceNext,over?1800:win<0?4200:2600);
}
function raceEnd(){markDone("race");
  if(!G)return;
  var win=G.sc[0]>=G.n?0:1;G.endAt=Date.now();
  raceEl.setAttribute("data-seat","end");raceEl.classList.remove("race-open");
  raceEl.innerHTML='<div class="rend panel"><p class="eyebrow">De race is klaar</p><h2 class="end-h">'+B.teams[win]+' '+B.wint+'</h2>'
   +'<p class="rend-sc"><b>'+B.teams[0]+'</b> '+G.sc[0]+' · <b>'+B.teams[1]+'</b> '+G.sc[1]+'</p>'
   +(G.hard.length?'<div class="lab-row"><p>Deze woorden waren lastig:</p>'+PGNAV+'</div>'+WLBOX:'<p>Niemand tikte een fout antwoord aan. Knap!</p>')
   +'<div class="row"><button class="btn btn-primary" data-g="again">Nog een race</button><button class="btn btn-quiet" data-g="quit">Stoppen</button></div></div>';
  if(G.hard.length)makePager(el("wl"),el("pg"),wlItems(G.hard,false));
}

/* ---------- Bediening ---------- */
stage.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b||b.disabled)return;
  var a=b.dataset.a, v=b.dataset.v;
  if(a==="go")go(v);
  else if(a==="askreset")home(true);
  else if(a==="askopen"){askOpen=true;home();askOpen=false;}
  else if(a==="allopen"){stap[sKey()]=Math.max(curStap(),ORDER.length-1);save();home();}
  else if(a==="pickblk"){setBlock(v);go("block");}
  else if(a==="pickset"){setId=v;save();setButtons();updateRiver();go("home");}
  else if(a==="reset"){stap[sKey()]=0;pool().forEach(function(x){lvl[x.id]=0;rep[x.id]=0;due[x.id]=0;});checkFin();save();updateRiver();home();}
  else if(a==="flip"){S.flipped=!S.flipped;renderFlash();}
  else if(a==="fyes")flashAnswer(true);
  else if(a==="fno")flashAnswer(false);
  else if(a==="tile")tile(v);
  else if(a==="ans")answer(Number(v));
  else if(a==="next")next();
  else if(a==="pg"){if(curPager)curPager.go(Number(v));}
  else if(a==="rseat"){raceSeat=v;raceSetup();}
  else if(a==="rlen"){raceLen=Number(v);raceSetup();}
  else if(a==="rstart")raceStart();
  else if(a==="tstart")testStart();
  else if(a==="tpick")testPick(Number(v));
  else if(a==="tnext")testNext();
  else if(a==="kshow")klasStep();
});
stage.addEventListener("submit",function(e){e.preventDefault();typeCheck();});
document.addEventListener("click",function(e){if(e.target.closest("[data-fs]"))fsToggle();});
["fullscreenchange","webkitfullscreenchange"].forEach(function(n){document.addEventListener(n,function(){fsPaint();if(view==="start")go("start");});});
stage.addEventListener("change",function(e){if(e.target.id==="flash-rev"&&S){flashRev=e.target.checked;S.flipped=false;renderFlash();}});
document.addEventListener("keydown",function(e){
  if(!S||e.key<"1"||e.key>"4"||e.ctrlKey||e.metaKey||e.altKey)return;
  if((view==="quiz"||view==="fill")&&!S.answered)answer(Number(e.key)-1);
  else if(view==="test"&&S.kind==="test")testPick(Number(e.key)-1);
});
document.querySelector(".seg").addEventListener("click",function(e){
  var b=e.target.closest("[data-set]");if(!b)return;
  setId=b.dataset.set;save();setButtons();updateRiver();go("home");
});

/* Oefentijd: loopt zolang je aan het oefenen bent, niet op de startpagina's en niet als de pagina op de achtergrond staat. */
var pracMs=0, lastT=Date.now(), timerEl=el("timer");
setInterval(function(){
  var now=Date.now(), d=now-lastT;lastT=now;
  if(view==="start"||view==="block"||document.hidden||d>3000)return;
  pracMs+=d;
  var t=Math.floor(pracMs/1000), m=Math.floor(t/60), sec=t%60;
  timerEl.textContent=(m<10?"0":"")+m+":"+(sec<10?"0":"")+sec;
},500);

/* Bij draaien of een ander schermformaat de bladzijden opnieuw indelen. */
var rsT=0;window.addEventListener("resize",function(){clearTimeout(rsT);rsT=setTimeout(function(){if(curPager)curPager.redraw();},150);});

load();setBlock(blk);fsPaint();go("start");
})();
</script>
