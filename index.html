<!doctype html><html lang="nl"><head><meta charset=utf8><title>Taalwoorden groep 8</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Taalwoorden"><meta name="theme-color" content="#14879B"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: één scherm zonder scrollen. Bovenaan een smalle band (titel, meanderende rivier als voortgang, weekkeuze); daaronder één speelvlak dat de rest van het scherm vult. Alles schaalt mee met het scherm, van iPad tot digibord. */
:root{
  /* Eén lichte weergave met zachte kleuren, ook als het apparaat op donker staat: in de klas ziet iedereen hetzelfde. */
  --bg:#F2F8F7; --surface:#FFFFFF; --ink:#17404A; --ink-soft:#456469; --line:#CFE0DF;
  --river:#14879B; --river-pale:#D3EDF0; --bank:#D6EBDA; --on-river:#FFFFFF;
  --buoy:#F4B942; --on-buoy:#3A2A00; --rival:#F2907B; --on-rival:#4A1208; --good:#1F7A4A; --good-bg:#DFF3E6; --bad:#B4443A; --bad-bg:#FAE5E1;
  /* Themakleur: een zachte tint waarop de route, de titelband en de themapagina staan. */
  --band:#C9EAEE; --on-band:#17404A; --band-soft:#3F6A72; --band-line:rgba(23,64,74,.26);
  --rt-bank:#A9D9B7; --rt-todo:#F4FCFD; --rt-done:#1E98AD; --rt-goal:#6CC4D2; --tk-ink:#17404A;
  /* Eén vaste kleur per oefenvorm: een lichte tint met een pictogram in de volle kleur. */
  --m-flash:#D9590B; --m-flash-bg:#FFE6D3; --m-match:#1F78C8; --m-match-bg:#DCECFB; --m-fill:#6A4BD6; --m-fill-bg:#E8E1FB; --m-quiz:#C22F66; --m-quiz-bg:#FBDFE9; --m-type:#0B8A7A; --m-type-bg:#D6F2EC; --m-test:#4E5968; --m-test-bg:#E6E9EE;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --fs-0:.95rem; --fs-1:1.0625rem; --fs-2:1.3rem; --fs-3:1.65rem; --fs-4:clamp(2rem,7vw,2.9rem);
  color-scheme:light;
}

/* Elk thema heeft eigen kleuren. Rivieren gebruikt de basiskleuren hierboven. */
[data-blk="culturen"]{--bg:#F7F4EC;--ink:#2A3150;--ink-soft:#555C77;--line:#DDD8CB;--river:#4A68C8;--river-pale:#DEE6F9;--bank:#E6DFCD;
  --band:#F1E1B4;--on-band:#2A3150;--band-soft:#5B5F78;--band-line:rgba(42,49,80,.26);--rt-bank:#DDC88E;--rt-todo:#FCF6E3;--rt-done:#4A68C8;--rt-goal:#4A68C8;--tk-ink:#2A3150}
[data-blk="virussen"]{--bg:#F1F8F2;--ink:#173F2A;--ink-soft:#466553;--line:#CFE3D4;--river:#23824F;--river-pale:#D6EFDF;--bank:#D3EAD9;
  --band:#CDEBD6;--on-band:#173F2A;--band-soft:#3E6A50;--band-line:rgba(23,63,42,.26);--rt-bank:#A8D9B8;--rt-todo:#F3FCF5;--rt-done:#23824F;--rt-goal:#23824F;--tk-ink:#173F2A}
[data-blk="helden"]{--bg:#FBF3EF;--ink:#4A1D14;--ink-soft:#73483D;--line:#EBD6CE;--river:#B83A22;--river-pale:#F8DDD4;--bank:#F1DCD2;
  --band:#F7D3C4;--on-band:#4A1D14;--band-soft:#7A4436;--band-line:rgba(74,29,20,.26);--rt-bank:#EDB7A2;--rt-todo:#FFF6F2;--rt-done:#B83A22;--rt-goal:#B83A22;--tk-ink:#4A1D14}
[data-blk="horen"]{--bg:#F5F2FB;--ink:#2E2152;--ink-soft:#594C7A;--line:#DDD5EE;--river:#6544C2;--river-pale:#E6DEFA;--bank:#E1D9F2;
  --band:#DED3F5;--on-band:#2E2152;--band-soft:#5A4A84;--band-line:rgba(46,33,82,.26);--rt-bank:#C3B2EA;--rt-todo:#FAF8FF;--rt-done:#6544C2;--rt-goal:#6544C2;--tk-ink:#2E2152}
[data-blk="media"]{--bg:#F0F5FC;--ink:#14325C;--ink-soft:#435C80;--line:#D1DFF1;--river:#2563C4;--river-pale:#D9E7FB;--bank:#D6E3F5;
  --band:#CFE0F8;--on-band:#14325C;--band-soft:#3E5F8C;--band-line:rgba(20,50,92,.26);--rt-bank:#A9C6EE;--rt-todo:#F6FAFF;--rt-done:#2563C4;--rt-goal:#2563C4;--tk-ink:#14325C}
[data-blk="schrijven"]{--bg:#FAF5EC;--ink:#3D2810;--ink-soft:#6A5338;--line:#E8DCC8;--river:#8E5414;--river-pale:#F3E3CB;--bank:#EEE0C8;
  --band:#F1DFBF;--on-band:#3D2810;--band-soft:#6E5230;--band-line:rgba(61,40,16,.26);--rt-bank:#DEC08F;--rt-todo:#FFFAF1;--rt-done:#8E5414;--rt-goal:#8E5414;--tk-ink:#3D2810}
[data-blk="snelheid"]{--bg:#FBF4EE;--ink:#3A2414;--ink-soft:#6B4F3B;--line:#ECDACB;--river:#C4520E;--river-pale:#FCE2CF;--bank:#E9E2DC;
  --band:#FFD9BD;--on-band:#3A2414;--band-soft:#74492B;--band-line:rgba(58,36,20,.26);--rt-bank:#8E8A86;--rt-todo:#F4F1EE;--rt-done:#C4520E;--rt-goal:#C4520E;--tk-ink:#3A2414}

/* ---------- Logo en intro-animatie ---------- */
.lg{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--display);font-weight:800;font-size:var(--fs-1);color:var(--ink);letter-spacing:-.01em}
.lg svg{width:2.2rem;height:2.2rem;flex:none;filter:drop-shadow(0 2px 4px rgba(16,60,70,.18))}
.lg b{color:var(--river)}
#intro{position:fixed;inset:0;z-index:999;display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(120% 90% at 50% 38%,#1BA3B9 0%,#0F7186 46%,#0A4A5A 100%);color:#fff;transition:opacity .45s ease,transform .45s ease}
#intro.weg{opacity:0;transform:scale(1.06);pointer-events:none}
#intro .in-c{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:1rem;text-align:center;width:min(92vw,46rem)}
#intro .in-mark{width:clamp(6rem,22vmin,10rem);height:clamp(6rem,22vmin,10rem);animation:inPop .7s cubic-bezier(.2,1.6,.4,1) .1s both}
#intro .in-mark svg{width:100%;height:100%;filter:drop-shadow(0 10px 24px rgba(0,0,0,.3))}
#intro .in-word{margin:.3rem 0 0;font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,11vmin,6rem);line-height:1;letter-spacing:-.02em;display:flex}
#intro .in-word span{display:inline-block;animation:inUp .55s cubic-bezier(.2,1.4,.4,1) both}
#intro .in-word .y{color:#F4B942}
#intro .in-route{width:100%;height:auto;margin-top:-.2rem;overflow:visible}
#intro .in-route path{fill:none;stroke:rgba(255,255,255,.85);stroke-width:7;stroke-linecap:round;stroke-dasharray:700;stroke-dashoffset:700;animation:inDraw 1.1s ease-out 1.15s forwards}
#intro .in-route text{font-size:34px;opacity:0;animation:inPop .45s cubic-bezier(.2,1.6,.4,1) both;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#intro .in-tag{margin:.2rem 0 0;font-family:var(--display);font-weight:600;font-size:clamp(1rem,3.2vmin,1.5rem);letter-spacing:.14em;text-transform:uppercase;opacity:0;animation:inFade .5s ease 2.2s forwards}
#intro .in-skip{position:absolute;right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));min-height:2.75rem;padding:.5rem 1.1rem;border-radius:999px;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:700;cursor:pointer}
#intro .in-skip:focus-visible{outline:3px solid #F4B942;outline-offset:3px}
@keyframes inPop{from{opacity:0;transform:scale(.3) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(.7em) scale(.8)}to{opacity:1;transform:none}}
@keyframes inDraw{to{stroke-dashoffset:0}}
@keyframes inFade{from{opacity:0;transform:translateY(.4em)}to{opacity:.95;transform:none}}

/* ---------- Race-effecten: aftellen, vonken, +1, schudden, inhaalmelding, confetti ---------- */
.rmid{position:relative}
.rfx{position:fixed;left:0;top:0;pointer-events:none;z-index:1001}
.rspark{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);animation:rSpark .75s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes rSpark{from{transform:translate(-50%,-50%) scale(1.2);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15);opacity:0}}
.rplus{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--c);text-shadow:0 2px 0 rgba(0,0,0,.18),0 0 14px rgba(255,255,255,.9);animation:rPlus 1s ease-out forwards}
@keyframes rPlus{0%{transform:translate(-50%,0) scale(.5);opacity:0}20%{transform:translate(-50%,-14px) scale(1.25);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.rp-win{animation:rGlow 1s ease-out}
@keyframes rGlow{0%{box-shadow:0 0 0 0 var(--boat)}35%{box-shadow:0 0 0 9px var(--boat),0 0 30px 6px var(--boat)}100%{box-shadow:0 0 0 0 transparent}}
.rp-shake{animation:rShake .45s ease}
@keyframes rShake{0%,100%{translate:0 0}20%{translate:-11px 0}40%{translate:10px 0}60%{translate:-6px 0}80%{translate:4px 0}}
.rboat.vroem{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px var(--vc))}
.rban{position:absolute;left:50%;top:50%;z-index:5;white-space:nowrap;pointer-events:none;font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3.6vw,2.3rem);color:#fff;background:var(--river);padding:.15em .9em;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.28);animation:rBan 1.7s ease forwards}
@keyframes rBan{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-6deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(2deg)}24%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
.rcount{position:fixed;inset:0;z-index:1002;display:grid;place-items:center;background:rgba(10,40,48,.55);pointer-events:none}
.rcount span{font-family:var(--display);font-weight:800;font-size:clamp(6rem,30vmin,14rem);line-height:1;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.35);animation:rCnt .7s cubic-bezier(.2,1.5,.4,1) both}
.rcount span.go{color:#F4B942;font-size:clamp(4rem,18vmin,9rem)}
@keyframes rCnt{0%{transform:scale(2.2);opacity:0}35%{transform:scale(.95);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(.7);opacity:0}}
.rconf{position:fixed;top:-24px;z-index:1003;width:10px;height:16px;border-radius:2px;background:var(--c);pointer-events:none;animation:rFall var(--t) linear var(--d) forwards}
@keyframes rFall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.rtrof{font-size:clamp(3.5rem,12vmin,6rem);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;animation:inPop .7s cubic-bezier(.2,1.6,.4,1) .15s both}
.rend .end-h{animation:inUp .6s cubic-bezier(.2,1.4,.4,1) .3s both}
@media (prefers-reduced-motion:reduce){.rfx,.rcount,.rconf,.rban{display:none}.rp-shake,.rp-win,.rtrof,.rend .end-h{animation:none}.rboat.vroem{filter:none}}

/* ---------- Route bovenin: rustig bewegen, en een feestje bij elk geleerd woord ---------- */
.river-svg .tok-in{animation:tZweef 2.6s ease-in-out infinite}
@keyframes tZweef{50%{transform:translateY(-3px) rotate(-2deg)}}
.river-svg .d-emo{transform-box:fill-box;transform-origin:50% 100%;animation:dWieg 3.4s ease-in-out infinite}
.river-svg .deco .d-emo:nth-of-type(2n){animation-delay:-1.1s}.river-svg .deco .d-emo:nth-of-type(3n){animation-delay:-2.2s}
@keyframes dWieg{0%,100%{transform:none}50%{transform:translateY(-3px) rotate(4deg)}}
#rivDone.glans{animation:rGlans 1.1s ease}
@keyframes rGlans{35%{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 9px var(--river)) brightness(1.25)}}
.bfx{position:fixed;left:0;top:0;z-index:50;pointer-events:none}
.bspark{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c);animation:rSpark .8s cubic-bezier(.1,.8,.3,1) forwards}
.bplus{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1;color:var(--river);white-space:nowrap;text-shadow:0 0 10px #fff,0 0 4px #fff;animation:rPlus 1.2s ease-out forwards}
@media (prefers-reduced-motion:reduce){.river-svg .tok-in,.river-svg .d-emo,#rivDone.glans{animation:none}.bfx{display:none}}
.tk-emo,.d-emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}


*{box-sizing:border-box}
/* De hele pagina schaalt mee met het kader waarin hij staat: een browser, een digibord of een ingesloten kader (bijvoorbeeld in Canva).
   De lettergrootte volgt de krapste maat van het kader, zodat alles altijd op één scherm past en in het midden staat.
   Alleen op een staande telefoon scrolt de pagina gewoon. */
html{font-size:16px}
@media (min-width:521px), (min-aspect-ratio:3/4){ html{font-size:clamp(6px,min(2.15vw,1.78vh),34px);font-size:clamp(6px,min(2.15vw,1.78dvh),34px)} }
@media (min-aspect-ratio:5/4){ html{font-size:clamp(6px,min(1.5vw,2.3vh),34px);font-size:clamp(6px,min(1.5vw,2.3dvh),34px)} }
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs-1);line-height:1.5;min-height:100vh;min-height:100dvh}
body[data-deep]{background:var(--band);color:var(--on-band)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.wrap{max-width:76rem;margin-inline:auto;padding-inline:clamp(16px,2.2vw,2.5rem);padding-block:1rem 2rem;display:flex;flex-direction:column;gap:1rem}

.top{display:flex;flex-direction:column;gap:.3rem;background:var(--band);color:var(--on-band);border-radius:1.2rem;padding:.55rem .9rem .4rem}
.top .seg{background:transparent;border-color:var(--band-line)}
.top .seg-btn{color:var(--on-band)}
.top .seg{background:var(--rt-todo)}
.top .seg-btn[aria-pressed="true"]{background:var(--river);color:var(--on-river)}
.top .timer,.top .r-labels{color:var(--band-soft)}
.top .timer b{color:var(--on-band)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.25rem}
.top-info{display:flex;flex-wrap:nowrap;align-items:baseline;justify-content:space-between;gap:.2rem 1.5rem;flex:1 1 100%;min-width:0}
.timer{flex:none;margin:0;font-size:var(--fs-0);color:var(--ink-soft);white-space:nowrap}
.timer b{font-family:var(--display);font-size:var(--fs-2);color:var(--ink);font-variant-numeric:tabular-nums;margin-left:.25rem}
.prog{min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.1rem);line-height:1;margin:0;letter-spacing:-.01em}
.sub{margin:.25rem 0 0;color:var(--ink-soft);font-size:var(--fs-0)}
.seg{display:inline-flex;gap:2px;padding:3px;border:2px solid var(--line);border-radius:999px;background:var(--surface)}
.seg-btn{border:0;background:transparent;border-radius:999px;padding:.45rem .95rem;font-weight:700;font-size:var(--fs-0);min-height:2.5rem}
.seg-btn[aria-pressed="true"]{background:var(--river);color:var(--on-river)}

.river-svg{display:block;width:100%;height:auto}
/* De route staat altijd op de volle themakleur. */
.r-bank{stroke:var(--rt-bank)} .r-water{stroke:var(--rt-todo)} .r-done{stroke:var(--rt-done)}
.r-sea,.r-end{fill:var(--rt-goal)} .r-spring{fill:var(--rt-done)}
.tk{stroke:var(--tk-ink);stroke-width:1.6;stroke-linejoin:round} .tk-a{fill:var(--buoy)} .tk-b{fill:var(--rival)}
.tk-line{fill:none;stroke:var(--tk-ink);stroke-width:1.8;stroke-linecap:round}
.sail-a{fill:var(--buoy);stroke:var(--surface);stroke-width:1.5}
.sail-b{fill:var(--rival);stroke:var(--surface);stroke-width:1.5}
.hs-body{fill:var(--tk-ink)} .hs-leg{fill:none;stroke:var(--tk-ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round} .hs-tail{fill:none;stroke:var(--tk-ink);stroke-width:3.4;stroke-linecap:round}
.r-joint{stroke:var(--tk-ink);stroke-opacity:.16}
.tok-in{transform-box:fill-box;transform-origin:50% 100%}
.hop .tok-in{animation:hop .6s ease}
@keyframes hop{30%{transform:translateY(-10px) scale(1.2)}62%{transform:translateY(0) scale(.95)}100%{transform:none}}
.boat-hull{fill:var(--tk-ink);stroke:var(--surface);stroke-width:1.5}
.boat-mast{stroke:var(--tk-ink);stroke-width:2.5;fill:none}
#boat{transition:transform .7s ease}
.r-labels{display:flex;justify-content:space-between;gap:.5rem;color:var(--ink-soft);font-size:.85rem;letter-spacing:.03em}
.r-status{margin:0;font-size:var(--fs-1);line-height:1.3;min-width:0;padding:.15rem .2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-status b{font-family:var(--display);font-size:var(--fs-2)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:1.4rem;padding:clamp(1rem,4vw,1.75rem);display:flex;flex-direction:column;gap:1rem}
.panel p{margin:0}
.home{display:flex;flex-direction:column;gap:.6rem}
.foot-ask{display:flex;align-items:center;gap:.75rem 1rem;width:100%}
.foot-ask span{flex:1 1 auto;min-width:0}
.foot-ask .btn{flex:none}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
.mode{color:var(--ink);display:flex;flex-direction:column;gap:.3rem;text-align:left;padding:.75rem 1rem .85rem;border-radius:1.1rem;border:2px solid var(--line);background:var(--surface);transition:transform .15s ease,border-color .15s ease}
.mode:hover{transform:translateY(-2px);border-color:var(--river)}
.mode-top{display:flex;align-items:center;gap:.65rem}
.mode-ttl{display:flex;flex-direction:column;min-width:0}
.mode-ttl .eyebrow{line-height:1.25}
.badge{flex:none;display:grid;place-items:center;width:2.3rem;height:2.3rem;border-radius:.7rem;background:var(--m-bg,var(--river-pale));color:var(--m,var(--river))}
.badge-s{width:1.75rem;height:1.75rem;border-radius:.5rem}
.badge-duo{background:var(--buoy);color:var(--on-buoy)}
.ico{width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
[data-m="flash"]{--m:var(--m-flash);--m-bg:var(--m-flash-bg)} [data-m="match"]{--m:var(--m-match);--m-bg:var(--m-match-bg)} [data-m="fill"]{--m:var(--m-fill);--m-bg:var(--m-fill-bg)} [data-m="quiz"]{--m:var(--m-quiz);--m-bg:var(--m-quiz-bg)} [data-m="type"]{--m:var(--m-type);--m-bg:var(--m-type-bg)} [data-m="test"]{--m:var(--m-test);--m-bg:var(--m-test-bg)} [data-m="klas"]{--m:var(--on-buoy);--m-bg:var(--buoy)}
.mode[data-m]:hover{border-color:var(--m)}
.duos.duos3{grid-template-columns:repeat(3,minmax(0,1fr))}
.lk-link{margin-top:.6rem;font-size:var(--fs-0);color:var(--band-soft)}
.lk{display:flex;flex-direction:column;gap:.8rem}
.lk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.lk-blok{border:2px solid var(--line);border-radius:1rem;padding:.8rem 1rem;display:flex;flex-direction:column;gap:.45rem;min-width:0}
.lk-blok h3{margin:0;font-family:var(--display);font-size:var(--fs-2)}
.lk-chips{display:flex;flex-wrap:wrap;gap:.35rem}
.lk-chip{border:2px solid var(--line);background:var(--surface)}
.lk-stappen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.2rem .8rem}
.lk-themas .lk-chips{gap:1.2rem;margin-top:.6rem}

.kopt-goed{border-color:var(--good);background:var(--good-bg)} .kopt-goed .kopt-l{background:var(--good)}
.kopt-weg{opacity:.35}
.klas .klas-a{display:none}
.mode.dicht,.duo.dicht{opacity:.5;cursor:not-allowed;transform:none!important;filter:grayscale(.6)}

.foot-ask2{display:inline-flex;gap:.5rem;align-items:center;font-size:var(--fs-0)}
.eyebrow{font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;opacity:.85}

.d-dark{fill:var(--tk-ink);fill-opacity:.8} .d-light{fill:var(--surface);stroke:var(--tk-ink);stroke-width:1.2}
/* Typen, Toets en Klassenquiz. */
.type-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.5rem .75rem}

.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.25rem 1rem;min-height:2.5rem}

.bar-mid{flex:1 1 14rem;text-align:center;font-size:var(--fs-0)}

.check{display:flex;gap:.5rem;align-items:center;color:var(--ink-soft);font-size:var(--fs-0)}

.card{width:100%;min-height:15rem;border-radius:1.4rem;border:3px solid var(--river);padding:1.5rem 1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;text-align:center;animation:turn .28s ease}

.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,5fr);gap:.6rem .75rem;align-items:start}

.tile{text-align:left;padding:.5rem .8rem;border:2px solid var(--line);border-radius:.75rem;background:var(--surface);min-height:3.4rem;font-size:.95rem;line-height:1.3;overflow-wrap:break-word;hyphens:auto}
.tile-w{font-weight:700}
.tile-sel{border-color:var(--river);background:var(--river-pale)}

@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.q-lead{margin:0;color:var(--ink-soft)}
.q-main{font-family:var(--display);font-weight:800;font-size:var(--fs-4);line-height:1.1;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.q-long{font-size:var(--fs-3);font-weight:600;line-height:1.25}
.q-zin{font-size:var(--fs-2);font-weight:600;line-height:1.45;text-wrap:pretty;overflow-wrap:break-word}
.gap{display:inline-block;min-width:5.5em;border-bottom:3px solid var(--river);line-height:1.1}

.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.75rem;align-items:center;text-align:left;padding:.6rem .9rem;border:2px solid var(--line);border-radius:.9rem;background:var(--surface);min-height:3.4rem;line-height:1.3}
.opt:hover:not(:disabled){border-color:var(--river)}
.opt-key{width:1.7rem;height:1.7rem;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.opt-mark{font-weight:700;font-size:var(--fs-0)}
.opt:disabled{cursor:default;color:var(--ink-soft)}
.opt-good,.opt-good:disabled{border-color:var(--good);background:var(--good-bg);color:var(--ink)}
.opt-good .opt-mark{color:var(--good)}
.opt-bad,.opt-bad:disabled{border-color:var(--bad);background:var(--bad-bg);color:var(--ink)}
.opt-bad .opt-mark{color:var(--bad)}
.fb{display:flex;flex-direction:column;gap:.75rem;min-height:1.5rem}
.fb p{margin:0}

.end-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem 1.2rem}
.end-h{font-family:var(--display);font-weight:800;font-size:var(--fs-3);line-height:1.15;margin:0;text-wrap:balance}
.score{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,9vw,3.4rem);line-height:1;color:var(--river);font-variant-numeric:tabular-nums}
.lab-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;min-height:2.5rem}
.pg{display:flex;align-items:center;gap:.5rem}
.pg-btn{width:2.5rem;height:2.5rem;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.3rem;font-weight:700;line-height:1;padding:0}
.pg-btn:disabled{opacity:.35;cursor:default}
.wl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wl li{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr) auto;gap:.15rem 1rem;padding:.5rem 0;border-top:1px solid var(--line);align-items:baseline;line-height:1.35}
.wl-w{font-weight:700}
.wl-z{grid-column:1 / -1;color:var(--ink-soft);font-size:var(--fs-0)}
.wl-z .gap-filled{color:var(--ink);font-weight:700;text-decoration:none}
.wl-tags{display:flex;gap:.4rem;align-items:baseline}
.wl-wk{color:var(--ink-soft);font-size:.85rem;white-space:nowrap}
.pill{font-size:.8rem;font-weight:700;padding:.05rem .5rem;border-radius:.35rem;text-transform:uppercase;letter-spacing:.05em;transform:rotate(-3deg);background:var(--good-bg);color:var(--good);border:1px solid var(--good);white-space:nowrap}
.pill-half{background:transparent;color:var(--ink-soft);border-color:var(--line)}
.start{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.55rem}
.start>p{margin:0}
.start-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;min-height:2.5rem}
.fs-btn{display:inline-flex;align-items:center;gap:.5rem;min-height:2.5rem;padding:.3rem .9rem;background:var(--surface);border-color:var(--line);color:var(--ink);font-size:var(--fs-0)}
.fs-btn .ico,.fs-ic .ico{width:1.2rem;height:1.2rem}
.fs-ic{flex:none;align-self:center;display:grid;place-items:center;width:2.5rem;height:2.5rem;padding:0;border-radius:50%;border:2px solid var(--band-line);background:var(--rt-todo);color:var(--on-band)}
.start-h{font-size:clamp(2.6rem,9vw,4.6rem)}
.start-lead{font-size:var(--fs-2);line-height:1.35;max-width:38rem;margin:0}
.start-river{display:block;width:100%;height:auto}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:.75rem;width:100%}
.themes-few{grid-template-columns:minmax(0,1fr)}
/* Veel thema's: kleinere kaarten, op een breed scherm vier naast elkaar. */
.themes-many{grid-template-columns:repeat(auto-fit,minmax(14.5rem,1fr))} .themes-many .theme{padding:.8rem 1rem .95rem}
.theme{background:var(--band);color:var(--on-band);border-color:var(--band);padding:1.1rem 1.3rem 1.3rem}
.theme .mode-desc,.theme .week-n{color:var(--band-soft)}
.theme .meter{background:var(--rt-todo)} .theme .meter span{background:var(--rt-done)}
.theme:hover{border-color:var(--rt-done)}
body[data-deep] .start .eyebrow{color:var(--band-soft);opacity:1}
body[data-deep] .start .link{color:var(--on-band)}
.theme-svg{display:block;width:100%;height:auto;margin-bottom:.4rem}
.weeks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;width:100%}
.meter{display:block;width:100%;height:.5rem;border-radius:999px;background:var(--river-pale);overflow:hidden;margin-top:.5rem}
.meter span{display:block;height:100%;background:var(--river);border-radius:999px}
.week-n{font-size:var(--fs-0);color:var(--ink-soft)}
.stamp{display:inline-block;border:2px solid currentColor;border-radius:.4rem;padding:0 .45rem;font-family:var(--display);font-weight:800;font-size:.8em;line-height:1.5;text-transform:uppercase;letter-spacing:.06em;transform:rotate(-4deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
.fb .stamp,.tile-star::after{color:var(--good)}
@keyframes stamp{from{transform:rotate(-16deg) scale(2.3);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.tile-star::after{content:" ✓ geleerd";font-weight:700}
.fin{position:fixed;inset:0;z-index:60;background:var(--band);color:var(--on-band);display:grid;place-items:center;padding:1.5rem;overflow:auto}
.fin-in{width:min(62rem,100%);display:flex;flex-direction:column;align-items:flex-start;gap:1rem}
.fin .eyebrow{color:var(--band-soft);opacity:1;margin:0}
.fin-h{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,4.4rem);line-height:1.05;margin:0;text-wrap:balance}
.fin-svg{display:block;width:100%;height:auto}
.fin-p{margin:0;font-size:var(--fs-2);line-height:1.5}
.fin-btn{background:var(--river);color:var(--on-river)}
.fin-btn2{background:transparent;border-color:var(--band-line);color:var(--on-band)}
.fin .row{width:100%}
.setup-row{display:flex;flex-wrap:wrap;gap:.75rem 2.5rem}
.setup-q{margin:0 0 .4rem;font-weight:700}
.setup-set{color:var(--ink-soft);font-size:var(--fs-0)}

/* Brede schermen (iPad liggend, digibord): titel, rivier en weekkeuze op één rij. */
@media (min-aspect-ratio:5/4){
  .modes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .wl-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:2.5rem;align-content:start}
}
/* Vanaf iPad liggend staan aantal en oefentijd rechts op dezelfde regel als de titel. */
@media (min-aspect-ratio:5/4){ .top-info{flex:1 1 0;justify-content:flex-end} .modes{max-height:24rem} .themes-few{grid-template-columns:repeat(auto-fit,minmax(18rem,1fr))} .start-big{font-size:clamp(2.8rem,10vw,5.6rem)} }
/* Smalle schermen (telefoon): alles onder elkaar. */
@media (max-width:520px) and (max-aspect-ratio:3/4){
  .top-info{flex-wrap:wrap}
  .r-status{white-space:normal}
  .modes{grid-template-columns:minmax(0,1fr)}
  .duos,.duos.duos3,.lk-grid{grid-template-columns:minmax(0,1fr)}
  .kopts{grid-template-columns:minmax(0,1fr)}
  .weeks{grid-template-columns:minmax(0,1fr)}
  .themes{grid-template-columns:minmax(0,1fr)}
  .wl li{grid-template-columns:minmax(0,1fr) auto}
  .wl-m{grid-column:1 / -1;grid-row:2}
  .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tile{padding:.5rem .5rem;font-size:.85rem}
  .bar-mid{order:3;flex-basis:100%;text-align:left}
}
/* Eén scherm: op iPad en digibord past alles zonder scrollen. */
@media (min-width:521px), (min-aspect-ratio:3/4){
  html{height:100%}
  body{height:100%;min-height:0;overflow:hidden}
  .wrap{height:100%;padding-block:.75rem;gap:.75rem}
  #stage{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
  #stage.panel{overflow:auto;padding:1.1rem 1.4rem;gap:.75rem}
  .panel>*{flex-shrink:0}
  .home{flex:1}
  .start{flex:1;justify-content:center;position:relative}
  .start-bar{position:absolute;top:0;left:0;right:0}
  .modes{flex:1 1 auto;grid-auto-rows:1fr;max-height:40rem}
  .mode{justify-content:center}
  .panel>.card{flex:1 1 0;min-height:6rem}
  .panel>.cols{flex:1 1 0;min-height:0;align-items:stretch}
  .col{display:grid;grid-template-rows:auto repeat(6,minmax(0,1fr))}
  .tile{min-height:0;padding-block:.2rem}
  .panel>.opts{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-rows:minmax(4.5rem,auto)}
  .fb{flex-direction:row;align-items:center;justify-content:space-between;min-height:3.2rem}
  .fb .row{flex:0 0 auto}
  .panel>.wl{flex:0 1 auto;min-height:0;overflow:hidden}
  .panel>.klas{flex:1 1 0}
}

.race{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--ink);display:grid;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.race[data-seat="opp"]{grid-template:"b" minmax(0,1fr) "mid" auto "a" minmax(0,1fr) / minmax(0,1fr)}
.race[data-seat="side"]{grid-template:"mid mid" auto "a b" minmax(0,1fr) / minmax(0,1fr) minmax(0,1fr)}
.race[data-seat="end"]{grid-template:minmax(0,1fr) / minmax(0,1fr);place-items:center}
.rp-a{grid-area:a;--boat:var(--buoy);--boat-ink:var(--on-buoy)}
.rp-b{grid-area:b;--boat:var(--rival);--boat-ink:var(--on-rival)}
.rmid{grid-area:mid;display:flex;align-items:center;gap:8px;min-width:0;background:var(--band);border-radius:1.1rem;padding:.15rem .6rem}
.race[data-seat="opp"] .rp-b{transform:rotate(180deg)}
.rp{background:var(--surface);border:1px solid var(--line);border-radius:1.1rem;padding:.7rem .8rem;display:flex;flex-direction:column;gap:.45rem;min-height:0;min-width:0;overflow:auto}
.rp-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.2rem .8rem}
.rp-name{background:var(--boat);color:var(--boat-ink);font-weight:700;font-size:var(--fs-0);padding:.15rem .7rem;border-radius:999px}
.rp-score{font-family:var(--display);font-weight:800;font-size:var(--fs-2);font-variant-numeric:tabular-nums}
.rp-lead{flex:1 1 8rem;min-width:0;color:var(--ink-soft);font-size:var(--fs-0)}
.rp-q{margin:0;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.15;overflow-wrap:break-word}
.rp-q-long{font-size:1.2rem;font-weight:600;line-height:1.35}
.rp-opts{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-rows:minmax(4.2rem,auto);gap:8px}
.ro{border:2px solid var(--line);border-radius:.9rem;background:var(--bg);padding:.5rem .7rem;text-align:left;font-size:1rem;line-height:1.3;overflow-wrap:break-word;hyphens:auto;transition:opacity .2s;color:var(--ink)}
.ro:disabled{color:var(--ink);opacity:.55}
.race:not(.race-open) .ro{opacity:.5}
.rp-out .ro{opacity:.5}
.ro-good,.rp-out .ro-good{border-color:var(--good);background:var(--good-bg);opacity:1}
.ro-good::after{content:" ✓";color:var(--good);font-weight:700}
.ro-bad,.rp-out .ro-bad{border-color:var(--bad);background:var(--bad-bg);opacity:1}
.ro-bad::after{content:" ✗";color:var(--bad);font-weight:700}

/* Bladeren: de lijst toont zoveel regels als er op het scherm passen; de rest staat op een volgende bladzijde. */
function makePager(ul,nav,items,always){
  var starts=[0], page=0;
  function draw(){
    ul.innerHTML="";var i=starts[page];
    while(i<items.length){
      ul.insertAdjacentHTML("beforeend",items[i]);
      if(i>starts[page]&&ul.scrollHeight>ul.clientHeight+1){ul.removeChild(ul.lastElementChild);break;}
      i++;
    }
    starts[page+1]=i;
    var more=i<items.length;
    nav.hidden=!(always||page>0||more);
    nav.innerHTML='<button class="pg-btn" data-a="pg" data-g="pg" data-v="-1" aria-label="Vorige bladzijde"'+(page?'':' disabled')+'>‹</button>'
      +'<span class="count">'+(starts[page]+1)+'–'+i+' van '+items.length+'</span>'
      +'<button class="pg-btn" data-a="pg" data-g="pg" data-v="1" aria-label="Volgende bladzijde"'+(more?'':' disabled')+'>›</button>';
  }
  curPager={go:function(d){if(d>0&&starts[page+1]<items.length)page++;else if(d<0&&page>0)page--;else return;draw();},
            redraw:function(){starts=[0];page=0;draw();}};
  draw();
}

/* ---------- Koppelen ---------- */
function matchStart(){
  var ws=pick(6,true);S={ws:ws,sel:null,done:0,wrong:new Set(),mistakes:0,t0:0,timer:0,busy:false};
  function col(side,arr){return '<div class="col"><p class="col-h">'+(side==="L"?"Woorden":"Betekenissen")+'</p>'+arr.map(function(x){
    return '<button class="tile'+(side==="L"?" tile-w":"")+'" data-a="tile" data-v="'+side+x.id+'" id="t'+side+x.id+'">'+esc(side==="L"?x.w:x.m)+'</button>';}).join("")+'</div>';}
  stage.innerHTML=bar("0 seconden","Tik op een woord en daarna op de betekenis die erbij hoort.")+'<div class="cols">'+col("L",shuffle(ws))+col("R",shuffle(ws))+'</div>';
}
function tile(v){
  if(!S||S.busy)return;
  var side=v.charAt(0), id=Number(v.slice(1)), t=el("t"+v);
  if(!S.t0){S.t0=Date.now();S.timer=setInterval(function(){var c=el("count");if(c&&S)c.textContent=Math.round((Date.now()-S.t0)/1000)+" seconden";},1000);}
  if(!S.sel||S.sel.side===side){
    if(S.sel)S.sel.el.classList.remove("tile-sel");
    if(S.sel&&S.sel.el===t){S.sel=null;return;}
    S.sel={side:side,id:id,el:t};t.classList.add("tile-sel");return;
  }
  var a=S.sel;S.sel=null;a.el.classList.remove("tile-sel");
  if(a.id===id){
    [a.el,t].forEach(function(e){e.classList.add("tile-done");e.disabled=true;});
    if(!S.wrong.has(id)&&mark(id,true))(a.side==="L"?a.el:t).classList.add("tile-star");
    if(++S.done===S.ws.length)matchEnd();
  }else{
    S.mistakes++;
    [id,a.id].forEach(function(x){if(!S.wrong.has(x)){S.wrong.add(x);mark(x,false);}});
    S.busy=true;[a.el,t].forEach(function(e){e.classList.add("tile-bad");});
    setTimeout(function(){[a.el,t].forEach(function(e){e.classList.remove("tile-bad");});if(S)S.busy=false;},500);
  }
}
function matchEnd(){
  clearInterval(S.timer);
  var sec=Math.max(1,Math.round((Date.now()-S.t0)/1000)), m=S.mistakes, n=S.ws.length;S=null;markDone("match");
  setTimeout(function(){
    if(view!=="match")return;
    stage.innerHTML='<h2 class="end-h">Alles gekoppeld!</h2><p>'+n+' paren in '+sec+' seconden, '+(m===0?"zonder fouten.":m===1?"met 1 foutje.":"met "+m+" foutjes.")+'</p>'
     +'<div class="row"><button class="btn btn-primary" data-a="go" data-v="match">Nog een ronde</button><button class="btn btn-quiet" data-a="go" data-v="fill">Door naar Invullen</button><button class="btn btn-quiet" data-a="go" data-v="home">Terug</button></div>';
    maybeFin();
  },600);
}

/* ---------- Invullen en Quiz ---------- */
function quizStart(kind,lijst){
  var ws=lijst||pick(10);
  S={oefen:!!lijst,kind:kind,qs:ws.map(function(w,i){var dir=kind==="fill"?"zin":(i%2?"mw":"wm");
    return {w:w,dir:dir,zi:pickZin(w),opts:shuffle([w].concat(distract(w,dir==="zin")))};}),i:0,score:0,missed:[],answered:false};
  renderQ();
}
function renderQ(){
  var q=S.qs[S.i], d=q.dir;S.answered=false;
  stage.innerHTML=bar((d==="zin"?"Zin ":"Vraag ")+(S.i+1)+" van "+S.qs.length)
   +'<div><p class="q-lead">'+(d==="wm"?"Wat betekent":d==="mw"?"Welk woord past bij deze betekenis?":"Welk woord past in de zin?")+'</p>'
   +'<h2 class="q-main'+(d==="wm"?"":d==="mw"?" q-long":" q-zin")+'" id="qmain">'+(d==="wm"?esc(q.w.w):d==="mw"?esc(q.w.m):zin(q.w,true,q.zi))+'</h2></div>'
   +'<div class="opts">'+q.opts.map(function(o,k){return '<button class="opt" data-a="ans" data-v="'+k+'" id="opt'+k+'"><span class="opt-key">'+(k+1)+'</span><span>'+esc(d==="wm"?o.m:o.w)+'</span><span class="opt-mark"></span></button>';}).join("")+'</div>'
   +'<div class="fb" id="fb" aria-live="polite"></div>';
}
function answer(k){
  if(!S||S.answered||!S.qs[S.i].opts[k])return;
  var q=S.qs[S.i], ok=q.opts[k]===q.w, last=S.i===S.qs.length-1;S.answered=true;
  q.opts.forEach(function(o,j){var b=el("opt"+j);b.disabled=true;
    if(o===q.w){b.classList.add("opt-good");b.lastChild.textContent="✓ goed";}
    else if(j===k){b.classList.add("opt-bad");b.lastChild.textContent="✗ fout";}});
  var learned=mark(q.w.id,ok), goed="Goed zo!"+(learned?' <span class="stamp">Geleerd</span>':'');
  if(ok)S.score++;else S.missed.push(q.w);
  if(q.dir==="zin")el("qmain").innerHTML=zin(q.w,false,q.zi);
  var uitleg="<b>"+esc(q.w.w)+"</b> betekent: "+esc(q.w.m)+".";
  el("fb").innerHTML='<p>'+(ok?(q.dir==="zin"?goed+" "+uitleg:goed):"Niet goed. "+uitleg)+'</p>'
   +'<div class="row"><button class="btn btn-primary" data-a="next" id="next">'+(last?"Bekijk je score":q.dir==="zin"?"Volgende zin":"Volgende vraag")+'</button></div>';
  el("next").focus({preventScroll:true});
}
function next(){
  if(++S.i<S.qs.length)return S.kind==="type"?renderType():renderQ();
  var sc=S.score, n=S.qs.length, missed=S.missed, kind=S.kind, oefen=S.oefen, nodig=Math.ceil(n*MINSCORE), gehaald=sc>=nodig;S=null;
  if(!oefen&&gehaald)markDone(kind);
  laatsteFout=missed;
  var vast=!oefen&&!gehaald&&ORDER.indexOf(kind)===curStap();
  if(oefen||vast){
    stage.innerHTML='<div class="end-top"><h2 class="end-h">'+(oefen?"Foute woorden geoefend":"Bijna!")+'</h2><div class="score">'+sc+' / '+n+'</div></div>'
     +'<p>'+(oefen?"Goed geoefend. Doe nu een nieuwe ronde: met "+Math.ceil(10*MINSCORE)+" van de 10 goed gaat de volgende stap open."
       :"Je hebt er "+nodig+" van de "+n+" goed nodig om door te gaan. Oefen eerst de woorden die je fout had.")+'</p>'
     +(missed.length?'<div class="lab-row"><p>'+(oefen?"Deze zijn nog lastig:":"Deze had je fout:")+'</p>'+PGNAV+'</div>'+WLBOX:'')
     +'<div class="row">'+(!oefen&&missed.length?'<button class="btn btn-primary" data-a="retry" data-v="'+kind+'">Oefen de foute woorden</button>':'')
     +'<button class="btn '+(oefen||!missed.length?"btn-primary":"btn-quiet")+'" data-a="go" data-v="'+kind+'">Nieuwe ronde</button>'
     +'<button class="btn btn-quiet" data-a="go" data-v="flash">Flitskaarten</button><button class="btn btn-quiet" data-a="go" data-v="home">Terug</button></div>';
    if(missed.length)makePager(el("wl"),el("pg"),wlItems(missed,false));
    return;}
  var msg=sc===n?"Alles goed. Jij kent deze woorden!":sc>=n*0.7?"Goed gedaan. Nog een paar woorden om te oefenen.":"Deze woorden zijn nog lastig. Oefen ze met de flitskaarten.";
  stage.innerHTML='<div class="end-top"><h2 class="end-h">Jouw score</h2><div class="score">'+sc+' / '+n+'</div></div><p>'+msg+'</p>'
   +(missed.length?'<div class="lab-row"><p>Deze had je fout:</p>'+PGNAV+'</div>'+WLBOX:'')
   +'<div class="row">'+(kind==="fill"
     ? '<button class="btn btn-primary" data-a="go" data-v="fill">Nog een ronde</button><button class="btn btn-quiet" data-a="go" data-v="type">Door naar Typen</button>'
     : kind==="type"
     ? '<button class="btn btn-primary" data-a="go" data-v="type">Nog een ronde</button><button class="btn btn-quiet" data-a="go" data-v="quiz">Door naar de quiz</button>'
     : '<button class="btn btn-primary" data-a="go" data-v="quiz">Nog een quiz</button><button class="btn btn-quiet" data-a="go" data-v="zin">Door naar Eigen zin</button>')
   +'<button class="btn btn-quiet" data-a="go" data-v="home">Terug</button></div>';
  if(missed.length)makePager(el("wl"),el("pg"),wlItems(missed,false));
  maybeFin();
}

/* ---------- Typen: het woord zelf schrijven ---------- */
function norm(t){return t.toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g," ").trim();}
function bare(t){return t.replace(/^(de|het) /,"");}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++)m[i]=[i];for(j=1;j<=b.length;j++)m[0][j]=j;
  for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];}
function typeStart(lijst){var q=lijst||pick(10);S={oefen:!!lijst,kind:"type",qs:q,i:0,score:0,missed:[],tries:0,answered:false};renderType();}
function renderType(){
  var w=S.qs[S.i];S.answered=false;S.tries=0;
  stage.innerHTML=bar("Woord "+(S.i+1)+" van "+S.qs.length)
   +'<div><p class="q-lead">Welk woord hoort bij deze betekenis?</p><h2 class="q-main q-long" id="qmain">'+esc(w.m)+'</h2></div>'
   +'<form class="type-row" id="type-form" autocomplete="off"><label class="type-lab" for="type-in">Typ het woord</label>'
   +'<input class="type-in" id="type-in" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done">'
   +'<button class="btn btn-primary" type="submit" id="type-ok">Controleer</button></form>'
   +'<div class="fb" id="fb" aria-live="polite"></div>';
  el("type-in").focus({preventScroll:true});
}
function typeCheck(){
  if(!S||S.kind!=="type")return;
  if(S.answered)return next();
  var w=S.qs[S.i], inp=el("type-in"), v=norm(inp.value), goal=norm(w.w);
  if(!v)return;
  var ok=v===goal||v===bare(goal);
  /* Bijna goed (hooguit twee letters verschil)? Dan mag je het één keer opnieuw proberen. */
  if(!ok&&S.tries===0&&Math.min(lev(v,goal),lev(v,bare(goal)))<=2){
    S.tries=1;el("fb").innerHTML='<p>Bijna goed. Kijk nog eens naar de spelling en probeer het opnieuw.</p>';inp.focus({preventScroll:true});return;}
  S.answered=true;inp.readOnly=true;inp.classList.add(ok?"type-good":"type-bad");
  var learned=false;
  if(ok&&S.tries===0)learned=mark(w.id,true);else if(!ok)mark(w.id,false);
  if(ok)S.score++;else S.missed.push(w);
  el("fb").innerHTML='<p>'+(ok?(S.tries?"Goed, in je tweede poging.":"Goed zo!"+(learned?' <span class="stamp">Geleerd</span>':'')):"Niet goed. Het woord is <b>"+esc(w.w)+"</b>.")+'</p>';
  var b=el("type-ok");b.textContent=S.i===S.qs.length-1?"Bekijk je score":"Volgende woord";b.focus({preventScroll:true});
}

/* ---------- Toets: alle woorden één keer, zonder hulp, met een uitslagscherm ---------- */
function testIntro(){
  var n=pool().length, t=tests[blk+":"+setId];
  stage.innerHTML=bar(n+" vragen")
   +'<h2 class="end-h">Toets</h2>'
   +'<p>Je krijgt alle '+n+' woorden één keer. Je ziet pas aan het eind wat goed was, en je kunt niet terug naar een vorige vraag. De toets telt niet mee voor je voortgang.</p>'
   +(t?'<p>Je laatste toets: <b>'+t.s+' van '+t.n+'</b>'+(t.d?' op '+esc(t.d):'')+'.</p>':'')
   +'<div class="type-row"><label class="type-lab" for="naam-in">Je voornaam</label><input class="type-in naam-in" id="naam-in" maxlength="30" autocomplete="off" autocapitalize="words" spellcheck="false" value="'+esc(NAAM)+'"></div>'
   +'<div class="row"><button class="btn btn-primary" data-a="tstart">Begin de toets</button></div>';
}

  S={kind:"test",qs:shuffle(pool()).map(function(w,i){var dir=["wm","mw","zin"][i%3];

  var k=d.sort(function(a,c){return c.length-a.length;})[0]||b;return k.length>6?k.slice(0,Math.max(5,k.length-3)):k.slice(0,Math.max(3,k.length-1));}

/* ---------- Race-effecten ---------- */
var RCOL=["#F4B942","#F2907B"];
function rStil(){return !!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);}
function rFx(cls,x,y,css,html){if(!raceEl)return;var d=document.createElement("div");d.className="rfx "+cls;d.style.cssText="left:"+x+"px;top:"+y+"px;"+(css||"");if(html)d.textContent=html;raceEl.appendChild(d);setTimeout(function(){d.remove();},1300);return d;}
/* Vonken rond de pion van het team dat goed had. */
function rVonk(p){var t=el("rb"+p);if(!t||rStil())return;var r=t.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  for(var i=0;i<16;i++){var a=Math.PI*2*i/16+Math.random()*.4,s=40+Math.random()*45;rFx("rspark",x,y,"--c:"+RCOL[p]+";--dx:"+(Math.cos(a)*s).toFixed(0)+"px;--dy:"+(Math.sin(a)*s).toFixed(0)+"px");}
  t.style.setProperty("--vc",RCOL[p]);t.classList.add("vroem");setTimeout(function(){t.classList.remove("vroem");},900);}

  var d=rFx("rplus",r.left+r.width/2,omg?r.bottom:r.top,"--c:"+RCOL[p]+(omg?";rotate:180deg":""),"+1");}
function rKlas(e,c,ms){if(!e)return;e.classList.remove(c);void e.offsetWidth;e.classList.add(c);setTimeout(function(){e.classList.remove(c);},ms);}

  var b=document.createElement("div");b.className="rban";b.textContent=txt;if(kleur)b.style.background=kleur;m.appendChild(b);setTimeout(function(){b.remove();},1800);}

function raceTouch(e){
  var t=e.target.closest("[data-g],[data-o]");if(!t||!G)return;
  var g=t.dataset.g;
  if(g==="pg"){if(curPager&&!t.disabled)curPager.go(Number(t.dataset.v));return;}
  if(g==="stop"){
    if(Date.now()-G.stopAt<3000)return raceQuit();
    G.stopAt=Date.now();t.textContent="Echt stoppen?";
    setTimeout(function(){if(t.isConnected)t.textContent="Stop";},3000);return;
  }
  if(g){if(Date.now()-G.endAt<900)return;if(g==="again")raceStart();else raceQuit();return;}
  e.preventDefault();raceTap(Number(t.dataset.p),Number(t.dataset.o));
}
function raceQuit(){raceClose();go("race");}
function raceTap(p,k){
  if(!G||!G.open||G.done||G.locked[p])return;
  var q=G.q;
  if(q.opts[k]===q.w){G.done=true;G.sc[p]++;return raceResolve(p);}
  G.locked[p]=true;
  raceEl.querySelector('.ro[data-p="'+p+'"][data-o="'+k+'"]').classList.add("ro-bad");
  el("rp"+p).classList.add("rp-out");rKlas(el("rp"+p),"rp-shake",500);el("rm"+p).textContent="Fout. Deze vraag doe je niet meer mee.";
  if(G.hard.indexOf(q.w)<0)G.hard.push(q.w);
  if(G.locked[1-p]){G.done=true;raceResolve(-1);}
}
function raceResolve(win){
  var q=G.q, ci=q.opts.indexOf(q.w);
  [0,1].forEach(function(p){
    raceEl.querySelectorAll('.ro[data-p="'+p+'"]').forEach(function(b){b.disabled=true;if(Number(b.dataset.o)===ci)b.classList.add("ro-good");});
    if(q.dir==="zin")el("rq"+p).innerHTML=zin(q.w,false,q.zi);
    el("rm"+p).textContent=win<0?"Niemand had het goed. Het goede antwoord heeft een vinkje."
      :win===p?"Goed! "+B.verder
      :G.locked[p]?B.teams[win]+" had het goed.":B.teams[win]+" was sneller.";
  });
  raceBoats();if(win>=0){hop(el("rb"+win));rKlas(el("rp"+win),"rp-win",1000);rPlus(win);setTimeout(function(){rVonk(win);},450);
    var ld=G.sc[0]>G.sc[1]?1:G.sc[1]>G.sc[0]?2:0, nu=win+1;
    if(G.sc[win]>=G.n){}
    else if(G.sc[win]===G.n-1)rBan("Nog één voor "+B.teams[win]+"!",RCOL[win]==="#F4B942"?"#B9800F":"#C4513A");
    else if(ld===nu&&G.lead!==nu&&G.lead!==0)rBan("Inhaalactie! 🔥");
    else if(ld===0&&G.sc[win]>1)rBan("Gelijk!");
    G.lead=ld;}
  var over=G.sc[0]>=G.n||G.sc[1]>=G.n;
  G.timer=setTimeout(over?raceEnd:raceNext,over?1800:win<0?4200:2600);
}
function raceEnd(){markDone("race");
